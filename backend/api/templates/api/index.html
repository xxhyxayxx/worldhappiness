<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Endpoints</title>
</head>
<body>
    <h1>API Endpoints</h1>
    <ul>
        {% for name, url_desc in routes.items %}
            <li><strong>{{ name }}</strong>: <a href="{{ url_desc.0 }}">{{ url_desc.0 }}</a> - {{ url_desc.1 }}</li>
        {% endfor %}
    </ul>
</body>
</html>
